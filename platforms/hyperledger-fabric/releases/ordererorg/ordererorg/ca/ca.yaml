apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ca
  namespace: ordererorg-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: ca
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-ca-server   
  values:
    global:
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
        kubernetesUrl: https://192.168.1.51:6443
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.1.51:8200
        authPath: devordererorg
        secretEngine: secretsv2
        secretPrefix: "data/devordererorg"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: pc1.nirav.com

    storage:
      size: 512Mi
      reclaimPolicy: "Delete"
      volumeBindingMode: Immediate
      allowedTopologies:
        enabled: false

    image:
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
      pullSecret: regcred

    server:
      removeCertsOnDelete: true
      tlsStatus: true
      adminUsername: ordererorg-admin
      adminPassword: ordererorg-adminpw
      subject: "/C=US/ST=California/L=SanFrancisco/O=OrdererOrg"
      clusterIpPort: 7054

    labels:
      service:
      pvc:
      deployment:
