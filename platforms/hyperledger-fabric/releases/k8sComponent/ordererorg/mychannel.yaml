global:
  version: 3.0.0
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://192.168.1.51:8200
    authPath: devordererorg
    secretEngine: secretsv2
    secretPrefix: "data/devordererorg"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: pc1.nirav.com

image:
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  pullSecret: regcred

orderers:
  - name: orderer1
    adminAddress: orderer1.ordererorg-net:7055
  - name: orderer2
    adminAddress: orderer2.ordererorg-net:7055
  - name: orderer3
    adminAddress: orderer3.ordererorg-net:7055
  - name: orderer4
    adminAddress: orderer4.ordererorg-net:7055

addOrderer: false

