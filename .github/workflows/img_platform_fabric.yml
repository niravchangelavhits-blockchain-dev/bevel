# Build Hyperledger Fabric docker images triggered by :
#  - push on develop branch for latest tags
#  - create tag vx.y.z for release tags
#  - Can be triggered manually

name: Build Hyperledger Fabric docker images

on:
  workflow_dispatch:
    inputs:
      fabric_version:
        description: 'Enter Fabric Version to build'
        required: true
        default: '3.0.0'
        type: choice
        options:
        - '3.0.0'
        - '2.5.4'
        - '2.2.2'
  create:
    tags:
      - v*
  push:
    branches:
      - develop
    paths:
      - 'platforms/hyperledger-fabric/images/**'
      - '.github/workflows/img_platform_fabric.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PATH: ghcr.io/${{ github.repository_owner }}

jobs:
  # on push to develop branch, create docker tags latest
  fabric-latest:
    if: ${{ startsWith(github.ref, 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: bevel-fabric-tools
            dockerfile: platforms/hyperledger-fabric/images/tools/Dockerfile
            fabric_version: '3.0.0'
          - image: bevel-fabric-orderer
            dockerfile: platforms/hyperledger-fabric/images/orderer/Dockerfile
            fabric_version: '3.0.0'
          - image: bevel-fabric-peer
            dockerfile: platforms/hyperledger-fabric/images/peer/Dockerfile
            fabric_version: '3.0.0'
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to the container registry
      uses: docker/login-action@v1
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase IMAGE_PATH
      id: image_path_format
      uses: ASzc/change-string-case-action@v2
      with:
        string: ${{ env.IMAGE_PATH }}

    - name: Build and push ${{ matrix.image }} latest
      if: github.event.inputs.fabric_version == ''
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          FABRIC_VERSION=${{ matrix.fabric_version }}
        tags: ${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:latest,${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:${{ matrix.fabric_version }}

    - name: Build and push ${{ matrix.image }} with provided version
      if: github.event.inputs.fabric_version != ''
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          FABRIC_VERSION=${{ github.event.inputs.fabric_version }}
        tags: ${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:latest,${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:${{ github.event.inputs.fabric_version }}

  fabric-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: bevel-fabric-tools
            dockerfile: platforms/hyperledger-fabric/images/tools/Dockerfile
            fabric_version: '3.0.0'
          - image: bevel-fabric-orderer
            dockerfile: platforms/hyperledger-fabric/images/orderer/Dockerfile
            fabric_version: '3.0.0'
          - image: bevel-fabric-peer
            dockerfile: platforms/hyperledger-fabric/images/peer/Dockerfile
            fabric_version: '3.0.0'
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set output
      id: vars
      run: echo ::set-output name=tag::${GITHUB_REF#refs/tags/v}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to the container registry
      uses: docker/login-action@v1
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase IMAGE_PATH
      id: image_path_format
      uses: ASzc/change-string-case-action@v2
      with:
        string: ${{ env.IMAGE_PATH }}

    - name: Build and push ${{ matrix.image }} release ${{ steps.vars.outputs.tag }}
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          FABRIC_VERSION=${{ matrix.fabric_version }}
        tags: ${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:${{ steps.vars.outputs.tag }},${{ steps.image_path_format.outputs.lowercase }}/${{ matrix.image }}:stable
