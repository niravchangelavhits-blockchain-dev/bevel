apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orderer2
  namespace: ordererorg-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: orderer2
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-orderernode
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.1.51:8200
        authPath: devordererorg
        secretEngine: secretsv2
        secretPrefix: "data/devordererorg"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: pc1.nirav.com

    storage:
      provisioner: "rancher.io/local-path"
      size: 512Mi
      reclaimPolicy: "Delete" 
      volumeBindingMode: WaitForFirstConsumer
      allowedTopologies:
        enabled: false

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.ordererorg-net.pc1.nirav.com
        caAdminUser: ordererorg-admin
        caAdminPassword: ordererorg-adminpw
        orgName: ordererorg
        type: orderer
        componentSubject: "O=OrdererOrg,OU=Orderer,L=37.77/-122.42/SanFrancisco,C=US"

      settings:
        createConfigMaps: False
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      orderer: ghcr.io/hyperledger/bevel-fabric-orderer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: regcred

    orderer:
      consensus: raft
      logLevel: info
      localMspId: ordererorgMSP
      tlsStatus: true
      keepAliveServerInterval: 10s
      serviceType: ClusterIP
      ports:
        grpc:
          clusterIpPort: 7050
        metrics: 
          enabled: False
          clusterIpPort: 9443
      resources:
        limits:
          memory: 512M
          cpu: 1
        requests:
          memory: 512M
          cpu: 0.25


    healthCheck: 
      retries: 10
      sleepTimeAfterError: 15

      labels:
        service:
        pvc:
        deployment:
