apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peer0
  namespace: org1-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: peer0
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-peernode    
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.1.37:8200
        authPath: devorg1
        secretEngine: secretsv2
        secretPrefix: "data/devorg1"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: pc2.rashmi.com

    storage:
      enabled: True
      peer: 512Mi
      couchdb: 512Mi
      reclaimPolicy: "Delete"
      volumeBindingMode: WaitForFirstConsumer
      provisioner: "rancher.io/local-path"
      allowedTopologies:
        enabled: false

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.org1-net.pc2.rashmi.com
        caAdminUser: org1-admin
        caAdminPassword: org1-adminpw
        orgName: org1
        type: peer
        componentSubject: "O=Org1,OU=Org1,L=40.73/-74/NewYork,C=US"


      settings:
        createConfigMaps: True
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      couchdb: ghcr.io/hyperledger/bevel-fabric-couchdb
      peer: ghcr.io/hyperledger/bevel-fabric-peer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: regcred

    peer:
      gossipPeerAddress: peer0.org1-net.pc2.rashmi.com:443
      logLevel: info
      localMspId: org1MSP
      tlsStatus: true
      cliEnabled: True
      ordererAddress: orderer1.ordererorg-net.pc1.nirav.com:443
      builder: hyperledger/fabric-ccenv
      couchdb:
        username: org1-user
        password: org1-userpw
      mspConfig:
        organizationalUnitIdentifiers:
        nodeOUs:
          clientOUIdentifier: client
          peerOUIdentifier: peer
          adminOUIdentifier: admin
          ordererOUIdentifier: orderer
      serviceType: ClusterIP 
      loadBalancerType: ""
      ports:
        grpc:
          clusterIpPort: 7051
        events:
          clusterIpPort: 7053
        couchdb:
          clusterIpPort: 5984
        metrics:
          enabled: False
          clusterIpPort: 9443    
      resources:
        limits:
          memory: 1Gi
          cpu: 1
        requests:
          memory: 512M
          cpu: 0.25
      upgrade: False
      healthCheck: 
        retries: 20
        sleepTimeAfterError: 15

    labels:
      service:
      pvc:
      deployment:
