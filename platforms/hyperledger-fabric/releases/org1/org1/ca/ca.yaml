apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ca
  namespace: org1-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: ca
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-ca-server   
  values:
    global:
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
        kubernetesUrl: https://192.168.1.66:6443
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.1.66:8200
        authPath: devorg1
        secretEngine: secretsv2
        secretPrefix: "data/devorg1"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: pc2.ankit.com

    storage:
      size: 512Mi
      reclaimPolicy: "Delete"
      volumeBindingMode: WaitForFirstConsumer
      provisioner: "rancher.io/local-path"
      allowedTopologies:
        enabled: false

    image:
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
      pullSecret: regcred

    server:
      removeCertsOnDelete: true
      tlsStatus: true
      adminUsername: org1-admin
      adminPassword: org1-adminpw
      subject: "/C=US/ST=NewYork/L=NewYork/O=Org1"
      clusterIpPort: 7054

    labels:
      service:
      pvc:
      deployment:
