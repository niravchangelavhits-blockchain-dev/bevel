global:
  version: 3.0.0
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://192.168.1.66:8200
    authPath: devorg1
    secretEngine: secretsv2
    secretPrefix: "data/devorg1"
    role: vault-role
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: pc2.ankit.com

image:
  fabricTools: ghcr.io/niravchangelavhits-blockchain-dev/bevel-fabric-tools
  alpineUtils: ghcr.io/niravchangelavhits-blockchain-dev/bevel-alpine:latest
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.org1-net.pc2.ankit.com:443
  localMspId: org1MSP
  logLevel: debug
  tlsStatus: true
  channelName: mychannel  
  ordererAddress: orderer1.ordererorg-net.pc1.nirav.com:443
  addPeerValue: false
  addnewOrgValue: false
